<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotary Encoder Real-time Monitor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00d2ff;
        }
        .display-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 15px;
            margin-top: 15px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }
        .label {
            font-size: 1rem;
            color: #a0a0a0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .value {
            font-size: 4rem;
            font-weight: bold;
            color: #3a7bd5;
            text-shadow: 0 0 15px rgba(58, 123, 213, 0.6);
            transition: all 0.05s ease;
        }
        .status {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ESP32 Monitor</h1>
        <div class="display-card">
            <div class="label">Rotary Encoder Value</div>
            <div class="value" id="encoderValue">0</div>
        </div>
        <div class="status">● System Active</div>
    </div>

    <script>
        let isFetching = false;

        async function fetchData() {
            if (isFetching) return;
            isFetching = true;

            try {
                const response = await fetch('/get_data');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('encoderValue').innerText = data.value;
                }
            } catch (error) {
                console.error("Error fetching data:", error);
            } finally {
                isFetching = false;
            }
        }

        // ดึงข้อมูลทุกๆ 50 มิลลิวินาที
        setInterval(fetchData, 50);
    </script>

</body>
</html>
